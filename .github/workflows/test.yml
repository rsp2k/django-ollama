name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        django-version: ["4.2", "5.0", "5.1"]
        exclude:
          # Django 5.0+ requires Python 3.10+
          - python-version: "3.9"
            django-version: "5.0"
          - python-version: "3.9"
            django-version: "5.1"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v2

    - name: Install dependencies
      run: |
        uv pip install --system Django==${{ matrix.django-version }}
        uv pip install --system -e .[dev]
        uv pip install --system -r requirements-dev.txt

    - name: Run pre-commit hooks
      run: |
        pre-commit run --all-files

    - name: Run tests
      run: |
        pytest --cov=src/django_ollama --cov-report=xml --cov-report=term-missing

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  integration-test:
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
        options: >-
          --health-cmd "curl -f http://localhost:11434/api/version"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v2

    - name: Install dependencies
      run: |
        uv pip install --system -e .[dev]
        uv pip install --system -r requirements-dev.txt

    - name: Wait for Ollama to be ready
      run: |
        timeout 300 bash -c 'until curl -f http://localhost:11434/api/version; do sleep 5; done'

    - name: Pull test model
      run: |
        curl -X POST http://localhost:11434/api/pull \
          -H "Content-Type: application/json" \
          -d '{"name": "llama3.2:1b"}'
        # Wait for model to be available
        timeout 300 bash -c 'until curl -s http://localhost:11434/api/tags | grep -q "llama3.2:1b"; do sleep 10; done'

    - name: Run integration tests
      env:
        OLLAMA_HOST: http://localhost:11434
        REDIS_URL: redis://localhost:6379/0
      run: |
        pytest -m integration --cov=src/django_ollama --cov-report=xml

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v2

    - name: Install dependencies
      run: |
        uv pip install --system -e .[dev]
        uv pip install --system bandit safety

    - name: Run Bandit security check
      run: |
        bandit -r src/ -f json -o bandit-report.json || true

    - name: Run Safety check
      run: |
        safety check --json --output safety-report.json || true

    - name: Upload security artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json