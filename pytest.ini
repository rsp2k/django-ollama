[tool:pytest]
DJANGO_SETTINGS_MODULE = tests.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=src/django_ollama
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-branch
    --cov-fail-under=80
    --junit-xml=test-results.xml
    --asyncio-mode=auto
filterwarnings =
    ignore::django.utils.deprecation.RemovedInDjango50Warning
    ignore::django.utils.deprecation.RemovedInDjango51Warning
    ignore::DeprecationWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    websocket: marks tests that require websocket functionality
    ollama: marks tests that require Ollama server connection
    dashboard_track: marks tests for special dashboard tracking
    dashboard_ignore: marks tests to ignore in dashboard (still runs)

# Dashboard plugin integration (optional - enable with --dashboard)
# pytest_plugins = test_dashboard.plugins.pytest_dashboard
testpaths = tests