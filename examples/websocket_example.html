<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django-Ollama WebSocket Chat Example</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .chat-container {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            border-bottom: 1px solid #eee;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 20px;
            max-width: 70%;
        }
        .user-message {
            background-color: #007bff;
            color: white;
            margin-left: auto;
            text-align: right;
        }
        .assistant-message {
            background-color: #f8f9fa;
            color: #333;
            border: 1px solid #dee2e6;
        }
        .system-message {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
            text-align: center;
            margin: 10px auto;
            font-size: 0.9em;
        }
        .input-container {
            padding: 20px;
            display: flex;
            gap: 10px;
        }
        .message-input {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 16px;
        }
        .message-input:focus {
            border-color: #007bff;
        }
        .send-button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
        }
        .send-button:hover {
            background-color: #0056b3;
        }
        .send-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .config {
            padding: 20px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }
        .config-row {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 10px;
        }
        .config-row label {
            font-weight: 500;
            min-width: 100px;
        }
        .config-row input, .config-row select {
            padding: 5px 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .status {
            padding: 10px 20px;
            font-size: 0.9em;
            font-weight: 500;
        }
        .status.connected {
            background-color: #d4edda;
            color: #155724;
        }
        .status.disconnected {
            background-color: #f8d7da;
            color: #721c24;
        }
        .typing-indicator {
            font-style: italic;
            color: #666;
            padding: 10px 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Django-Ollama Chat</h1>
            <p>WebSocket Real-time Chat Example</p>
        </div>

        <div class="status disconnected" id="status">
            Disconnected
        </div>

        <div class="config">
            <div class="config-row">
                <label for="wsUrl">WebSocket URL:</label>
                <input type="text" id="wsUrl" value="ws://localhost:8000/ws/chat/" style="flex: 1;">
                <button onclick="connect()" id="connectBtn">Connect</button>
                <button onclick="disconnect()" id="disconnectBtn" disabled>Disconnect</button>
            </div>
            <div class="config-row">
                <label for="model">Model:</label>
                <select id="model">
                    <option value="llama3.2:1b">llama3.2:1b (fast)</option>
                    <option value="llama3.2:3b">llama3.2:3b (better)</option>
                    <option value="llama3.2">llama3.2 (best)</option>
                </select>
                <label for="streaming">Streaming:</label>
                <input type="checkbox" id="streaming" checked>
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="system-message">
                Welcome! Configure your settings above and click Connect to start chatting.
            </div>
        </div>

        <div class="input-container">
            <input
                type="text"
                id="messageInput"
                class="message-input"
                placeholder="Type your message here..."
                disabled
                onkeypress="if(event.key==='Enter') sendMessage()"
            >
            <button id="sendButton" class="send-button" onclick="sendMessage()" disabled>
                Send
            </button>
        </div>
    </div>

    <script>
        let ws = null;
        let currentSession = null;
        let isTyping = false;

        function connect() {
            const url = document.getElementById('wsUrl').value;

            try {
                ws = new WebSocket(url);

                ws.onopen = function(event) {
                    updateStatus('Connected', true);
                    document.getElementById('messageInput').disabled = false;
                    document.getElementById('sendButton').disabled = false;
                    document.getElementById('connectBtn').disabled = true;
                    document.getElementById('disconnectBtn').disabled = false;

                    addSystemMessage('Connected to WebSocket server');

                    // Start a new session
                    startSession();
                };

                ws.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    handleWebSocketMessage(data);
                };

                ws.onclose = function(event) {
                    updateStatus('Disconnected', false);
                    document.getElementById('messageInput').disabled = true;
                    document.getElementById('sendButton').disabled = true;
                    document.getElementById('connectBtn').disabled = false;
                    document.getElementById('disconnectBtn').disabled = true;

                    addSystemMessage('Disconnected from server');
                    removeTypingIndicator();
                };

                ws.onerror = function(error) {
                    console.error('WebSocket error:', error);
                    addSystemMessage('Connection error occurred');
                };

            } catch (error) {
                console.error('Connection failed:', error);
                addSystemMessage('Failed to connect: ' + error.message);
            }
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
                currentSession = null;
            }
        }

        function startSession() {
            const message = {
                type: 'start_session',
                name: 'Web Chat Session',
                model: document.getElementById('model').value,
                system_prompt: 'You are a helpful AI assistant. Be concise and friendly.'
            };

            ws.send(JSON.stringify(message));
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message || !ws || ws.readyState !== WebSocket.OPEN) {
                return;
            }

            // Add user message to chat
            addMessage('user', message);

            // Clear input
            input.value = '';

            // Send message to server
            const wsMessage = {
                type: 'chat_message',
                message: message,
                model: document.getElementById('model').value,
                session_id: currentSession,
                stream: document.getElementById('streaming').checked
            };

            ws.send(JSON.stringify(wsMessage));

            // Show typing indicator
            if (document.getElementById('streaming').checked) {
                addTypingIndicator();
            }
        }

        function handleWebSocketMessage(data) {
            console.log('Received:', data);

            switch (data.type) {
                case 'session_started':
                    currentSession = data.session_id;
                    addSystemMessage(`Session started: ${data.name} (Model: ${data.model})`);
                    break;

                case 'chat_start':
                    // Prepare for incoming response
                    if (!document.getElementById('streaming').checked) {
                        addTypingIndicator();
                    }
                    break;

                case 'chat_chunk':
                    // Handle streaming content
                    if (!isTyping) {
                        removeTypingIndicator();
                        startAssistantMessage();
                        isTyping = true;
                    }
                    appendToLastMessage(data.content);
                    break;

                case 'chat_complete':
                    removeTypingIndicator();

                    if (!document.getElementById('streaming').checked) {
                        // Non-streaming response
                        addMessage('assistant', data.full_message || data.content);
                    } else {
                        // Streaming complete
                        finishAssistantMessage();
                    }
                    isTyping = false;
                    break;

                case 'session_ended':
                    currentSession = null;
                    addSystemMessage('Session ended');
                    break;

                case 'error':
                    removeTypingIndicator();
                    addSystemMessage('Error: ' + data.message);
                    isTyping = false;
                    break;

                default:
                    console.log('Unknown message type:', data.type);
            }
        }

        function addMessage(role, content) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}-message`;
            messageDiv.textContent = content;

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addSystemMessage(content) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message system-message';
            messageDiv.textContent = content;

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addTypingIndicator() {
            const chatContainer = document.getElementById('chatContainer');
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typingIndicator';
            typingDiv.className = 'typing-indicator';
            typingDiv.textContent = 'AI is typing...';

            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        function startAssistantMessage() {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.id = 'currentAssistantMessage';
            messageDiv.className = 'message assistant-message';
            messageDiv.textContent = '';

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendToLastMessage(content) {
            const currentMessage = document.getElementById('currentAssistantMessage');
            if (currentMessage) {
                currentMessage.textContent += content;
                document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;
            }
        }

        function finishAssistantMessage() {
            const currentMessage = document.getElementById('currentAssistantMessage');
            if (currentMessage) {
                currentMessage.id = ''; // Remove the ID
            }
        }

        function updateStatus(text, connected) {
            const status = document.getElementById('status');
            status.textContent = text;
            status.className = `status ${connected ? 'connected' : 'disconnected'}`;
        }

        // Auto-connect on page load for development
        window.addEventListener('load', function() {
            setTimeout(connect, 500);
        });
    </script>
</body>
</html>
